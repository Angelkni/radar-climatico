<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoreo Climático</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Radar Meteorológico Global</h1>
        <p class="subtitle">Consulta meteorológica en tiempo real mediante API REST</p>
        
        <div class="controls">
            <select id="citySelect">
                <option value="">-- Selecciona un País --</option>
                <option value="mexico">México</option>
                <option value="germany">Alemania</option>
                <option value="japan">Japón</option>
                <option value="canada">Canadá</option>
                <option value="spain">España</option>
                <option value="brazil">Brasil</option>
                <option value="australia">Australia</option>
            </select>
            <button id="fetchBtn">Escanear Clima</button>
        </div>

        <div id="loading" class="hidden">Estableciendo enlace satelital...</div>
        <div id="errorMsg" class="hidden"></div>

        <div id="weatherCard" class="weather-card hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
